<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Project</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Mooli&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <p class="name">Lucia</p>

    <img class="character" src="img/lucia.png" alt="Lucia" width="200">

    <div class="texts">

        <p class="tag">Select your character</p>
        <h2>It's not <br>
            just a game...</h2>

        <p class="support_text">Choose a legend from Vice City, or take a selfie and be the legend yourself!</p>
    </div>

    <div class="menu">
        <img onclick="chooseCharacter('Lucia', 'img/lucia.png', '#ff3cac')" class="avatar" src="img/lucia.png">

        <img onclick="chooseCharacter('Jason', 'img/jason.png', '#00b2c9')" class="avatar" src="img/jason.png">

        <img onclick="chooseCharacter('CJ', 'img/cj.png','#56ff3c')" class="avatar" src="img/cj.png">

        <label class="you">📷
            <input type="file" accept="image/*" hidden onchange="readImage(this)">
        </label>
    </div>


</body>
<script src="scripts.js"></script>
<script src="https://js.puter.com/v2/"></script>

</html>
